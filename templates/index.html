<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Form Corrector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        .section {
            margin-bottom: 25px;
        }
        h3 {
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
            margin-top: 0;
        }
        video, img {
            width: 100%;
            border-radius: 8px;
            background: #000;
            margin-top: 10px;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            margin-top: 10px;
        }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #ff6b81;
        }
        .stats {
            margin-top: 15px;
            font-size: 1.2rem;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>AI Fitness Form Corrector</h1>

    <div class="container">
        <!-- Live Camera Section (For Mobile/PC Web Browsers) -->
        <div class="section">
            <h3>Live Workout Camera</h3>
            <p style="font-size: 0.9rem; color: #aaa;">Prop up your phone and start tracking your form in real-time.</p>
            <button id="start-camera">Start Live Camera</button>
            <video id="webcam" autoplay playsinline muted style="display:none;"></video>
            <canvas id="canvas" style="display:none;"></canvas>
            <!-- Processed feed preview or stats display -->
            <div id="live-stats" class="stats" style="display:none;">
                Reps: <span id="rep-count">0</span> | Form: <span id="form-status">Ready</span>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

        <!-- Video Upload Section -->
        <div class="section">
            <h3>Upload Recorded Video</h3>
            <form action="/upload" method="POST" enctype="multipart/form-data">
                <input type="file" name="file" accept="video/*" required>
                <button type="submit">Analyze Uploaded Video</button>
            </form>
        </div>
    </div>

    <script>
        const startCameraButton = document.getElementById('start-camera');
        const webcamElement = document.getElementById('webcam');
        const liveStats = document.getElementById('live-stats');
        
        let streamInterval = null;

        startCameraButton.addEventListener('click', async () => {
            try {
                // Request front or rear camera on mobile (preferring environment/rear camera for workouts)
                const constraints = {
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                webcamElement.srcObject = stream;
                webcamElement.style.display = 'block';
                liveStats.style.display = 'block';
                startCameraButton.style.display = 'none';

                // Optional: Frame capture loop to send frames to backend via fetch/websockets if desired
                // We will hook this up to your Flask backend route next!
            } catch (err) {
                alert("Camera access denied or not supported on this browser/device: " + err);
            }
        });
    </script>
</body>
</html>

<script>
    const startCameraButton = document.getElementById('start-camera');
    const webcamElement = document.getElementById('webcam');
    const liveStats = document.getElementById('live-stats');
    const repCountSpan = document.getElementById('rep-count');
    const formStatusSpan = document.getElementById('form-status');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    
    let processingInterval = null;

    startCameraButton.addEventListener('click', async () => {
        try {
            // Request front/rear camera optimized for mobile screens
            const constraints = {
                video: { facingMode: "user", width: { ideal: 480 }, height: { ideal: 640 } }
            };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            webcamElement.srcObject = stream;
            webcamElement.style.display = 'block';
            liveStats.style.display = 'block';
            startCameraButton.style.display = 'none';

            // Start sending frames to backend every 200ms (~5 frames per second for smooth web traffic)
            processingInterval = setInterval(sendFrameToBackend, 200);

        } catch (err) {
            alert("Camera access denied or not supported on this device: " + err);
        }
    });

    function sendFrameToBackend() {
        if (webcamElement.readyState === webcamElement.HAVE_ENOUGH_DATA) {
            canvas.width = webcamElement.videoWidth;
            canvas.height = webcamElement.videoHeight;
            
            // Draw current video frame onto the canvas
            context.drawImage(webcamElement, 0, 0, canvas.width, canvas.height);
            
            // Convert canvas to a compressed base64 image string
            const imageData = canvas.toDataURL('image/jpeg', 0.6);

            // Send to Flask backend
            fetch('/process_frame', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ image: imageData })
            })
            .then(response => response.json())
            .then(data => {
                // Update your webpage dynamically with the response from Python
                repCountSpan.textContent = data.reps;
                formStatusSpan.textContent = data.form;
            })
            .catch(error => {
                console.error('Error sending frame:', error);
            });
        }
    }
</script>
